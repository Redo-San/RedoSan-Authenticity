<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RedoSan Authenticity{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a href="/" class="logo">RedoSan</a>
    <a href="/watermark" class="{% if request.path == '/watermark' %}active{% endif %}">Watermark</a>
    <a href="/fingerprint" class="{% if request.path == '/fingerprint' %}active{% endif %}">Fingerprint</a>
    <a href="/metadata" class="{% if request.path == '/metadata' %}active{% endif %}">Metadata</a>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer>
    RedoSan Authenticity &mdash; Beta &bull; Open Source (GPL v2)
  </footer>
</body>
</html>
