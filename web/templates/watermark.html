{% extends "base.html" %}
{% block title %}Watermark — RedoSan Authenticity{% endblock %}
{% block content %}
<h2 style="margin-bottom:24px">Digital Watermarking</h2>

<div class="card-form">
  <div style="display:flex;gap:8px;margin-bottom:20px">
    <button class="btn" id="tab-embed" onclick="switchTab('embed')" style="flex:1">Embed</button>
    <button class="btn" id="tab-extract" onclick="switchTab('extract')" style="flex:1;background:var(--card-hover);color:var(--text-muted)"">Extract</button>
  </div>

  <form id="watermark-form" onsubmit="return submitWatermark(event)">
    <div class="form-group">
      <label>Algorithm</label>
      <select name="type" id="wm-type">
        {% for t in types %}
        <option value="{{ t.id }}">{{ t.id }}. {{ t.name }}{% if not t.implemented %} (N/A){% endif %}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group" id="secret-group">
      <label>Secret file (optional — some types use the image itself)</label>
      <input type="file" name="secret">
    </div>
    <div class="form-group" id="image-group">
      <label>Image file</label>
      <input type="file" name="image" accept="image/*" required>
    </div>
    <div class="form-group">
      <label>Password (optional)</label>
      <input type="password" name="password" placeholder="Leave blank for no encryption">
    </div>
    <button type="submit" class="btn" id="submit-btn">Process</button>
    <div class="spinner" id="spinner"></div>
  </form>
</div>

<div id="result-area" style="display:none">
  <div class="result" id="result-json"></div>
  <div id="download-area" style="margin-top:12px;text-align:center"></div>
</div>

<script>
let currentMode = 'embed';
function switchTab(mode) {
  currentMode = mode;
  const embedBtn = document.getElementById('tab-embed');
  const extBtn = document.getElementById('tab-extract');
  const secretGroup = document.getElementById('secret-group');
  const imgLabel = document.getElementById('image-group').querySelector('label');
  if (mode === 'embed') {
    embedBtn.style.background = ''; embedBtn.style.color = '';
    extBtn.style.background = 'var(--card-hover)'; extBtn.style.color = 'var(--text-muted)';
    secretGroup.style.display = '';
    imgLabel.textContent = 'Cover image file';
  } else {
    extBtn.style.background = ''; extBtn.style.color = '';
    embedBtn.style.background = 'var(--card-hover)'; embedBtn.style.color = 'var(--text-muted)';
    secretGroup.style.display = 'none';
    imgLabel.textContent = 'Stego image file';
  }
}

async function submitWatermark(e) {
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const btn = document.getElementById('submit-btn');
  const spinner = document.getElementById('spinner');
  const resultArea = document.getElementById('result-area');
  const resultJson = document.getElementById('result-json');
  const downloadArea = document.getElementById('download-area');

  btn.disabled = true;
  spinner.style.display = 'block';
  resultArea.style.display = 'none';
  downloadArea.innerHTML = '';

  const endpoint = currentMode === 'embed' ? '/api/watermark/embed' : '/api/watermark/extract';
  try {
    const res = await fetch(endpoint, { method: 'POST', body: fd });
    if (res.headers.get('content-type')?.includes('application/json')) {
      const data = await res.json();
      resultJson.textContent = JSON.stringify(data, null, 2);
      resultArea.style.display = 'block';
    } else {
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const filename = currentMode === 'embed' ? 'watermarked.png' : 'extracted.zip';
      downloadArea.innerHTML = `<a href="${url}" download="${filename}" class="btn">Download ${filename}</a>`;
      resultArea.style.display = 'block';
      resultJson.textContent = 'File ready for download.';
    }
  } catch (err) {
    resultJson.textContent = 'Error: ' + err.message;
    resultArea.style.display = 'block';
  }
  btn.disabled = false;
  spinner.style.display = 'none';
}
</script>
{% endblock %}
