{% extends "base.html" %}
{% block title %}Fingerprint — RedoSan Authenticity{% endblock %}
{% block content %}
<h2 style="margin-bottom:24px">Forensic Fingerprinting</h2>

<div class="card-form">
  <form id="fp-form" onsubmit="return submitFingerprint(event)">
    <div class="form-group">
      <label>File to fingerprint</label>
      <input type="file" name="file" required>
    </div>
    <p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:16px">
      Supports images (PNG, JPG, etc.), audio (MP3, WAV, FLAC), video (MP4, AVI), and documents (PDF, DOCX).
    </p>
    <button type="submit" class="btn" id="fp-btn">Generate Fingerprint</button>
    <div class="spinner" id="fp-spinner"></div>
  </form>
</div>

<div id="fp-result" style="display:none">
  <div class="result" id="fp-json"></div>
</div>

<script>
async function submitFingerprint(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const btn = document.getElementById('fp-btn');
  const spinner = document.getElementById('fp-spinner');
  const resultDiv = document.getElementById('fp-result');
  const jsonDiv = document.getElementById('fp-json');

  btn.disabled = true;
  spinner.style.display = 'block';
  resultDiv.style.display = 'none';

  try {
    const res = await fetch('/api/fingerprint', { method: 'POST', body: fd });
    const data = await res.json();
    jsonDiv.textContent = JSON.stringify(data, null, 2);
    resultDiv.style.display = 'block';
  } catch (err) {
    jsonDiv.textContent = 'Error: ' + err.message;
    resultDiv.style.display = 'block';
  }
  btn.disabled = false;
  spinner.style.display = 'none';
}
</script>
{% endblock %}
