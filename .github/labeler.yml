# Auto-label PRs by changed paths (actions/labeler v5)
converter:
  - any: ['Converter/**/*']
c2pa:
  - any: ['C2PA/**/*']
certificate:
  - any: ['Certificate/**/*']
fingerprint:
  - any: ['Fingerprint/**/*']
metadata:
  - any: ['Metadata/**/*']
timestamp:
  - any: ['Timestamp/**/*']
watermark:
  - any: ['Watermark/**/*']
cli:
  - any: ['cli/**/*']
i18n:
  - any: ['Style_Web_Page/lang/**/*']
css:
  - any: ['Style_Web_Page/*.css']
ci:
  - any: ['.github/workflows/**/*']
