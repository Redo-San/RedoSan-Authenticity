name: Accessibility

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  pa11y:
    name: Pa11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx pa11y https://redo-san.github.io/RedoSan-Authenticity/
        continue-on-error: true

  axe:
    name: axe-core (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Start dev server
        run: node dev-server.js &
        env:
          PORT: 8080
      - name: Wait for server
        run: npx wait-on http://127.0.0.1:8080
      - name: Create axe test
        run: |
          mkdir -p cli/tests/a11y
          cat > cli/tests/a11y/axe_test.mjs << 'SCRIPT'
          import { chromium } from "playwright";
          import { AxeBuilder } from "@axe-core/playwright";

          const pages = [
            "/watermark/index.html",
            "/fingerprint/index.html",
            "/pixel-injection/index.html",
            "/document-watermark/index.html",
            "/audio-watermark/index.html",
            "/c2pa/index.html",
            "/certificate/index.html",
            "/forensic/index.html",
            "/converter/index.html",
            "/metadata/index.html",
            "/id_forge/index.html",
          ];

          let totalViolations = 0;
          let allPassed = true;

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext();
          const page = await context.newPage();

          for (const p of pages) {
            await page.goto("http://127.0.0.1:8080" + p, { waitUntil: "networkidle" });
            const results = await new AxeBuilder({ page }).analyze();
            if (results.violations.length > 0) {
              console.log(`\n${p}: ${results.violations.length} violations`);
              for (const v of results.violations) {
                console.log("  -", v.id, "(", v.impact, "):", v.help);
              }
              totalViolations += results.violations.length;
              allPassed = false;
            } else {
              console.log(`${p}: 0 violations`);
            }
          }

          await browser.close();
          console.log(`\nTotal violations: ${totalViolations}`);
          if (!allPassed) process.exit(1);
          SCRIPT
      - run: node cli/tests/a11y/axe_test.mjs
        continue-on-error: true
