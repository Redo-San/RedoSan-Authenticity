name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const TYPES = ['feat','fix','chore','docs','style','refactor','perf','test','ci','build','revert'];
            const RE = new RegExp('^('+TYPES.join('|')+')(\\(\\w+\\))?!?:\\s.+');
            const title = context.payload.pull_request.title;
            const num = context.issue.number;

            if (RE.test(title)) {
              const { data: comments } = await github.rest.issues.listComments({
                ...context.repo, issue_number: num
              });
              for (const c of comments) {
                if (c.user.type === 'Bot' && c.body.includes('PR Title Lint')) {
                  await github.rest.issues.deleteComment({
                    ...context.repo, comment_id: c.id
                  });
                }
              }
              return;
            }

            const body = '## WARNING: PR Title Lint\n\nThe PR title does not follow Conventional Commits.\n\n**Expected:** `type(scope): description`\n**Example:** `fix(auth): resolve login timeout`\n**Valid types:** '+TYPES.join(', ')+'\n\n**Current title:** `'+title+'`';

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: num
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('PR Title Lint')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: num, body
              });
            }
