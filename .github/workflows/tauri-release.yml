name: Tauri Release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # v1 ships Windows only (plan A10): offline forensic use-case is the
    # primary audience. Add ubuntu-22.04 later if demand appears; macOS
    # needs ad-hoc signing config and is out of scope for v1.
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # No cache steps here (plan A10 listed rust-cache + setup-node npm
      # cache): zizmor's cache-poisoning audit requires release workflows
      # to stay off GitHub Actions caches entirely - a poisoned cache from
      # an untrusted workflow could otherwise pivot into the installers
      # this workflow publishes. Tag-only runs build cold, which is fine.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm dependencies
        run: npx -y npm@11.20.0 ci

      # beforeBuildCommand (tauri-prepare-assets.mjs) requires all 30
      # offline assets, but only the 8 COMMITTED_VENDOR libs are tracked;
      # the other 22 are SHA-256-pinned downloads fetched here.
      - name: Fetch offline desktop assets
        run: node scripts/fetch-desktop-assets.mjs

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: RedoSan Authenticity Desktop v__VERSION__
          releaseBody: |
            Windows x64 build (v1). Unsigned: Windows SmartScreen will warn on first run -
            choose "More info" -> "Run anyway". Signing is a purchase decision tracked
            as the future upgrade path: https://v2.tauri.app/distribute/sign/windows/

            Offline-first: all 30 runtime assets are vendored and SHA-256-verified during
            the build; no network is required after installation.

            Known limitation: the ~200 MB voice biometric weights are not bundled, and the
            desktop CSP blocks the runtime fetch, so voice embedding is unavailable here.
          releaseDraft: true
          prerelease: false
