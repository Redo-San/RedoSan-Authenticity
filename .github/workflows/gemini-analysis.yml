name: Gemini AI Analysis

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Sync from head branch (stale merge ref bypass)
        run: |
          git fetch origin "$GITHUB_HEAD_REF" --depth=1
          git checkout "origin/$GITHUB_HEAD_REF" -- .
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: Run Gemini Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIFF=$(gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} 2>/dev/null | head -5000)
          PR_DATA=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json title,body 2>/dev/null)
          TITLE=$(echo "$PR_DATA" | jq -r '.title')
          BODY=$(echo "$PR_DATA" | jq -r '.body' | head -500)

          cat > /tmp/gemini_prompt.txt << EOF
          You are an expert code reviewer. Review this GitHub pull request.

          Title: $TITLE
          Description: $BODY

          Diff:
          \`\`\`diff
          $DIFF
          \`\`\`

          Focus on:
          1. Security vulnerabilities
          2. Logic bugs in algorithms (watermark, fingerprint, C2PA, etc.)
          3. Code quality issues
          4. Missing edge cases
          5. Performance problems

          Format as concise bullet points with file:line references. Respond in Arabic and English.
          EOF

          set +e
          npx -y @google/gemini-cli -p @/tmp/gemini_prompt.txt > review.txt 2>&1
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "Gemini CLI exit code: $RC"
            cat review.txt
            echo "Gemini review failed. Exit code $RC." > review.txt
          fi

          REVIEW=$(cat review.txt)
          echo "REVIEW<<EOF" >> $GITHUB_ENV
          echo "$REVIEW" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - name: Post Review Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "## 🤖 Gemini AI Review

          $REVIEW" 2>/dev/null || echo "Posted review comment"
