name: Gemini AI Analysis

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync from head branch (stale merge ref bypass)
        run: |
          git fetch origin "$GITHUB_HEAD_REF" --depth=1
          git checkout "origin/$GITHUB_HEAD_REF" -- .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Run Gemini Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          DIFF=$(gh pr diff "$PR_NUMBER" --repo "$REPO" 2>/dev/null | head -5000)
          PR_DATA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json title,body 2>/dev/null)
          TITLE=$(echo "$PR_DATA" | jq -r '.title')
          BODY=$(echo "$PR_DATA" | jq -r '.body' | head -500)

          {
            echo "You are an expert code reviewer. Review this GitHub pull request."
            echo ""
            echo "Title: $TITLE"
            echo "Description: $BODY"
            echo ""
            echo '```diff'
            echo "$DIFF"
            echo '```'
            echo ""
            echo "Focus on:"
            echo "1. Security vulnerabilities"
            echo "2. Logic bugs in algorithms (watermark, fingerprint, C2PA, etc.)"
            echo "3. Code quality issues"
            echo "4. Missing edge cases"
            echo "5. Performance problems"
            echo ""
            echo "Format as concise bullet points with file:line references. Respond in Arabic and English."
          } > "$GITHUB_WORKSPACE/gemini_prompt.txt"

          set +e
          npx -y @google/gemini-cli -p @"$GITHUB_WORKSPACE/gemini_prompt.txt" > review.txt 2>&1
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "Gemini CLI exit code: $RC"
            cat review.txt
            if grep -qi "quota\|rate limit" review.txt; then
              echo "Gemini review skipped: API quota exceeded (daily free-tier limit). The review will run automatically again once quota resets." > review.txt
            else
              echo "Gemini review failed. Exit code $RC." > review.txt
            fi
          fi

          REVIEW=$(cat review.txt)
          printf '%s' "$REVIEW" > "$GITHUB_WORKSPACE/gemini_review.txt"
          echo "Review body (first 200 chars):"
          head -c 200 "$GITHUB_WORKSPACE/gemini_review.txt"
      - name: Post Review Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$GITHUB_WORKSPACE/gemini_review.txt" 2>/dev/null || echo "Posted review comment"
