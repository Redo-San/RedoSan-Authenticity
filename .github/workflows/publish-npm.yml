name: Publish npm

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

concurrency:
  group: publish-npm-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  stage:
    name: Stage package on npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          # No `registry-url` here on purpose: it writes
          # `_authToken=${NODE_AUTH_TOKEN}` into the runner .npmrc, which makes
          # npm fall back to classic auth with an empty token (ENEEDAUTH) and
          # never start the OIDC exchange (npm/documentation#1960). The npm
          # default registry is already registry.npmjs.org.
          package-manager-cache: false

      # `npm stage publish` (staged publishing) is required by the npm Dual-Use
      # Content Policy: dual-use packages may not be published directly via
      # trusted publishing/OIDC, only staged. That subcommand needs an npm CLI
      # >= 11.15.0, and Node 24 ships npm >= 11.16.0; `check-latest` above
      # always selects the newest 24.x, so the bundled CLI is verified instead
      # of installing one ad-hoc (zizmor `adhoc-packages`: installing outside a
      # lockfile, which is also what made `npm@latest` an unpinned supply-chain
      # dependency).
      - name: Verify staged publishing support
        run: |
          npm -v
          if ! npm stage publish --help >/dev/null 2>&1; then
            echo "::error::npm stage publish requires npm >= 11.15.0 (staged publishing, GA 2026-05-22)."
            exit 1
          fi

      - name: Install system deps (canvas)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libjpeg-turbo8-dev libpango1.0-dev libgif-dev librsvg2-dev build-essential

      - name: Install npm deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Run check gate
        run: npm run check

      - name: npm audit (production deps)
        run: npm run audit:prod

      # OIDC trusted publishing: npm CLI >= 11.5.1 detects the
      # ACTIONS_ID_TOKEN_REQUEST_* env vars (granted by `id-token: write`)
      # and authenticates via OIDC before falling back to any token. Trust
      # `abb01470-8e56-44f7-a75b-735ec174dc0e` was validated by v2.0.1's
      # publish, so no NODE_AUTH_TOKEN secret is needed any more (follow-up:
      # revoke the `redosan_actions_stage` token and delete NPM_TOKEN).
      - name: Stage package (defers 2FA to approval)
        run: npm stage publish --provenance --access public

      - name: Remind maintainer to approve
        run: |
          echo "::notice title=Package staged::Run 'npm stage list' then 'npm stage approve <stage-id>' with 2FA to publish."

  # Records a GitHub Deployment (environment: npm) after the package is
  # staged, so the Deployments tab tracks the npm publish channel the same way
  # it tracks Pages and GHCR. Uses the `environment:` block (not POST
  # /deployments) for the same protected-branch 409 reason noted in
  # publish-containers.yml.
  deployment-record:
    name: Record npm deployment
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: npm
      url: https://www.npmjs.com/package/redosan
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Confirm npm stage
        run: echo "Staged redosan package on npm (pending maintainer approval) for ${GITHUB_REF_NAME}."
