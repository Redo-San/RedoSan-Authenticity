name: Performance

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start dev server
        run: node dev-server.js &
        env:
          PORT: 8080
      - name: Wait for server
        run: npx wait-on http://127.0.0.1:8080
      - name: Create LHCI config
        run: |
          node - << 'CONFIG'
          const fs = require('fs');
          const budgets = JSON.parse(
            fs.readFileSync('.tools/Developer_Toolkit/lighthouse-budgets.json', 'utf8')
          );
          const assertions = {
            'categories:accessibility': ['error', { minScore: 0.9 }],
            'categories:best-practices': ['error', { minScore: 0.9 }],
            'categories:seo': ['error', { minScore: 0.9 }],
            'categories:performance': ['warn', { minScore: 0.6 }],
          };
          for (const budget of budgets) {
            for (const row of budget.resourceSizes || []) {
              assertions[`resource-summary:${row.resourceType}:size`] = [
                'error',
                { maxNumericValue: row.budget * 1024 },
              ];
            }
          }
          const config = {
            ci: {
              collect: {
                url: ['http://127.0.0.1:8080/'],
                numberOfRuns: 3,
                startServerCommand: null,
                settings: { preset: 'desktop' },
              },
              assert: { assertions },
              upload: { target: 'temporary-public-storage' },
            },
          };
          fs.writeFileSync('lighthouserc.js', `module.exports = ${JSON.stringify(config, null, 2)};`);
          CONFIG
      - name: Run Lighthouse CI
        run: npx lhci autorun
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: error
      - name: Upload Lighthouse budgets
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-budgets
          path: .tools/Developer_Toolkit/lighthouse-budgets.json
          if-no-files-found: error
