name: Prettier Check

on:
  pull_request:
    types: [opened, synchronize]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  pull-requests: write
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = require('child_process').execSync;
            const base = context.payload.pull_request.base.sha || 'origin/main';

            const diff = run('git diff --name-only --diff-filter=ACMRT ' + base + '...HEAD -- "*.js" "*.css" "*.html" "*.json"', { encoding: 'utf8' });
            const files = diff.trim().split('\n').filter(Boolean).filter(f => !f.includes('i18n-data.js') && !f.includes('i18n.js'));

            if (files.length === 0) {
              console.log('No files to check.');
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Prettier Check')
            );

            try {
              run('npx prettier --config .tools/Developer_Toolkit/.prettierrc --ignore-path .tools/Developer_Toolkit/.prettierignore --check ' + files.join(' '), { encoding: 'utf8', stdio: 'pipe' });
              if (existing) {
                await github.rest.issues.deleteComment({
                  ...context.repo, comment_id: existing.id
                });
              }
            } catch (e) {
              const unformatted = e.stdout || '';
              const list = unformatted.trim().split('\n')
                .filter(Boolean)
                .filter(l => l.trim() !== 'Checking formatting...' && !/^(Warnings?|Errors?):/.test(l.trim()))
                .slice(0, 20);

              const body = '## Prettier Check\n\nFound ' + list.length + ' unformatted file(s):\n\n' +
                list.map(f => '- `' + f.replace('[warn] ', '').replace(' (code)', '').trim() + '`').join('\n') +
                '\n\nRun `npx prettier --write ' + files.join(' ') + '` to fix.';

              if (existing) {
                await github.rest.issues.updateComment({
                  ...context.repo, comment_id: existing.id, body
                });
              } else {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: context.issue.number, body
                });
              }
            }
