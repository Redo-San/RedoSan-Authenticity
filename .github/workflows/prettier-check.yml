name: Prettier Check

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Prettier check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          BASE="${{ github.event.pull_request.base.sha }}"

          FILES=$(git diff --name-only --diff-filter=ACMRT "$BASE...HEAD" -- "*.js" "*.css" "*.html" "*.json" \
            | grep -v 'i18n-data\.js' | grep -v 'i18n\.js' \
            | grep -v '^Style/pages/' | grep -v '^Style/shared\.js$' \
            | grep -v '^cli/' || true)

          if [ -z "$FILES" ]; then
            echo "No files to check."
            exit 0
          fi

          echo "Checking formatting for changed files..."
          echo "$FILES" | tr ' ' '\n'

          npx prettier --config .tools/Developer_Toolkit/.prettierrc \
            --ignore-path .tools/Developer_Toolkit/.prettierignore \
            --check $FILES 2>&1 | tee /tmp/prettier-output.txt
          PRETTIER_EXIT=$?

          if [ "$PRETTIER_EXIT" -eq 0 ]; then
            echo "All files formatted correctly."
            # Delete old bot comment if exists
            OLD_BODY=$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json comments --jq '.comments[] | select(.author.login == "github-actions[bot]" and (.body | contains("Prettier Check"))) | .id' 2>/dev/null || true)
            if [ -n "$OLD_BODY" ]; then
              gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --delete 2>/dev/null || true
            fi
            exit 0
          fi

          # Build the failure comment
          LIST=$(cat /tmp/prettier-output.txt \
            | sed 's/\x1b\[[0-9;]*m//g' \
            | grep '\[warn\]' \
            | sed 's/\[warn\] //' \
            | sed 's/ (code)//' \
            | head -20)

          COUNT=$(echo "$LIST" | wc -l | tr -d ' ')
          FILE_LIST=$(echo "$LIST" | sed 's/^/- `/' | sed 's/$/`/')

          BODY="## Prettier Check

          Found ${COUNT} unformatted file(s):

          ${FILE_LIST}

          Run \`npx prettier --write $FILES\` to fix."

          # Delete old bot comment if exists, then post new one
          gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json comments --jq '.comments[] | select(.author.login == "github-actions[bot]" and (.body | contains("Prettier Check"))) | .id' 2>/dev/null | while read -r CID; do
            gh api repos/${{ github.repository }}/issues/comments/"$CID" --method DELETE 2>/dev/null || true
          done
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body "$BODY"
          exit 1
