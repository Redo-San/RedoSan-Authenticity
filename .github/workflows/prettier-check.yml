name: Prettier Check

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run Prettier check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"

          FILES=$(git diff --name-only --diff-filter=ACMRT "$BASE...HEAD" -- "*.js" "*.css" "*.html" "*.json" \
            | grep -v 'i18n-data\.js' | grep -v 'i18n\.js' \
            | grep -v '^Style/pages/' | grep -v '^Style/shared\.js$' \
            | grep -v '^cli/' || true)

          if [ -z "$FILES" ]; then
            echo "No files to check."
            exit 0
          fi

          echo "Checking formatting for changed files..."

          npx prettier --config .tools/Developer_Toolkit/.prettierrc \
            --ignore-path .tools/Developer_Toolkit/.prettierignore \
            --check $FILES > /tmp/prettier-output.txt 2>&1 || true
          PRETTIER_EXIT=${PIPESTATUS[0]}

          if [ "$PRETTIER_EXIT" -eq 0 ]; then
            echo "All files formatted correctly."
            exit 0
          fi

          cat /tmp/prettier-output.txt \
            | sed 's/\x1b\[[0-9;]*m//g' \
            | grep '\[warn\]' \
            | sed 's/\[warn\] //' \
            | sed 's/ (code)//' \
            | head -20 \
            > /tmp/prettier-warnings.txt

          COUNT=$(wc -l < /tmp/prettier-warnings.txt | tr -d ' ')

          # Build file list as markdown
          printf '%s\n' "## Prettier Check" "" "Found ${COUNT} unformatted file(s):" "" > /tmp/prettier-body.md
          sed 's/^/- `/' /tmp/prettier-warnings.txt >> /tmp/prettier-body.md
          printf '%s\n' "" "Run \`npx prettier --write\` to fix." >> /tmp/prettier-body.md

          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file /tmp/prettier-body.md
          exit 1