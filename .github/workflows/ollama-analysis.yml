name: Ollama AI Code Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: number

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.inputs.pr_number != ''
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: block
          allowed-endpoints: >
            ollama.com:443
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            agent.api.stepsecurity.io:443
            prod.app-api.stepsecurity.io:443
      - name: Install and Start Ollama
        run: |
          for attempt in 1 2 3; do
            curl -fsSL --max-time 60 https://ollama.com/install.sh -o /tmp/ollama-install.sh
            bash /tmp/ollama-install.sh && break
            echo "Install attempt $attempt failed, retrying..." && sleep 5
          done
          ollama serve > /dev/null 2>&1 &
          for i in $(seq 1 30); do
            if curl -s http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama server ready after ${i}s"
              break
            fi
            echo "Waiting for Ollama... ${i}s"
            sleep 2
          done
          ollama pull qwen2.5-coder:7b
      - name: Run Ollama Code Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          DIFF=$(gh pr diff "$PR_NUMBER" --repo ${{ github.repository }} 2>/dev/null | head -c 200000 || true)
          PR_DATA=$(gh pr view "$PR_NUMBER" --repo ${{ github.repository }} --json title,body 2>/dev/null || echo '{}')
          TITLE=$(echo "$PR_DATA" | jq -r '.title // "N/A"')
          BODY=$(echo "$PR_DATA" | jq -r '.body // ""' | head -c 20000)

          if [ -z "$DIFF" ]; then
            printf '%s' "_No code changes to review._" > /tmp/review.md
            exit 0
          fi

          PROMPT=$(printf '%s\n' \
            "You are an expert code reviewer for a watermarking/authenticity web tool. Review this GitHub pull request." \
            "" \
            "Title: $TITLE" \
            "Description: $BODY" \
            "" \
            "Diff:" \
            '```diff' \
            "$DIFF" \
            '```' \
            "" \
            "Focus on:" \
            "1. Security vulnerabilities" \
            "2. Logic bugs in algorithms (watermark, fingerprint, C2PA, hashing, etc.)" \
            "3. Code quality issues" \
            "4. Missing edge cases" \
            "5. Performance problems" \
            "" \
            "Format as concise bullet points with file:line references. Respond in English only.")

          ESCAPED_PROMPT=$(echo "$PROMPT" | jq -Rs '.')

          for attempt in 1 2 3; do
            set +e
            REVIEW=$(curl -s --max-time 300 http://localhost:11434/api/generate \
              -d "{\"model\": \"qwen2.5-coder:7b\", \"prompt\": $ESCAPED_PROMPT, \"stream\": false, \"options\": {\"temperature\": 0.1}}" \
              | jq -r '.response // ""')
            RC=$?
            set -e
            if [ $RC -eq 0 ] && [ -n "$REVIEW" ]; then break; fi
            echo "Ollama attempt $attempt failed, retrying..."
            sleep 10
          done

          if [ $RC -ne 0 ] || [ -z "$REVIEW" ]; then
            echo "Ollama review failed"; exit 1
          fi

          printf '%s' "$REVIEW" > /tmp/review.md
      - name: Post Review Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo ${{ github.repository }} --body-file /tmp/review.md
