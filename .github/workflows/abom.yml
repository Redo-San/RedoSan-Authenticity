name: ABOM Supply Chain Audit

on:
  push:
    branches: [beta-release]
  pull_request:
    branches: [beta-release]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Run abom scan
        uses: JulietSecurity/abom@949aae195800a9de12067797cd0c84be6f2557b9 # v0.2.1
        with:
          args: --output json --check
