name: Broken Link Check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6
      - uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a53795c2b2e2ab57bb6152 # v2
        with:
          fail: false
          args: >-
            --verbose --no-progress --exclude-mail
            --exclude 'https://github.com/Redo-San/RedoSan-Authenticity/*'
            --exclude 'http://localhost*'
            --exclude 'https://img.shields.io/*'
            .
          format: json
          output: /tmp/lychee-report.json
      - name: Report broken links
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('/tmp/lychee-report.json', 'utf8'));

            const failures = report.failures || [];
            if (failures.length === 0) {
              console.log('No broken links found.');
              return;
            }

            const lines = failures.map(f =>
              `- [${f.url}](${f.url}) in \`${f.source}\` (${f.status})`
            );
            const body = `## 🔗 Broken Links Found

${lines.join('\n')}

_Generated by [lychee](https://github.com/lycheeverse/lychee) on $(new Date().toISOString().split('T')[0])_`;

            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'type/broken-links'
            });

            if (issues.length > 0) {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issues[0].number,
                body
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: 'Broken links report',
                body,
                labels: ['type/broken-links']
              });
            }
