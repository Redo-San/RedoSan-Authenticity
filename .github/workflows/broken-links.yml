name: Broken Link Check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          fail: false
          args: >-
            --verbose --no-progress --exclude-mail
            --exclude 'https://github.com/Redo-San/RedoSan-Authenticity/*'
            --exclude 'http://localhost*'
            --exclude 'https://img.shields.io/*'
            .
          format: json
          output: /tmp/lychee-report.json
      - uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/lychee-report.json';
            if (!fs.existsSync(path)) {
              console.log('No lychee report found.');
              return;
            }

            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const results = report.failures || report.results || report || [];
            const failures = Array.isArray(results)
              ? results.filter(r => r.status && r.status !== 200)
              : [];

            if (failures.length === 0) {
              console.log('No broken links found.');
              return;
            }

            const lines = failures.map(f =>
              '- [' + (f.url || f.uri) + '](' + (f.url || f.uri) + ') in `' + (f.source || f.file || 'unknown') + '`'
            );
            const body = '## Broken Links Found\n\n' + lines.join('\n') +
              '\n\n_Generated on ' + new Date().toISOString().split('T')[0] + '_';

            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'type/broken-links'
            });

            if (issues.length > 0) {
              await github.rest.issues.update({
                ...context.repo, issue_number: issues[0].number, body
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title: 'Broken links report', body, labels: ['type/broken-links']
              });
            }
