name: Broken Link Check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          fail: false
          args: >-
            --verbose --no-progress --exclude-mail
            --exclude 'https://github.com/Redo-San/RedoSan-Authenticity/*'
            --exclude 'http://localhost*'
            --exclude 'https://img.shields.io/*'
            .
      - name: Report broken links
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const files = ['/tmp/lychee/out.md', 'lychee/out.md', 'results.md']
              .filter(f => fs.existsSync(f));

            const output = files.length > 0
              ? fs.readFileSync(files[0], 'utf8').trim()
              : 'No report file found.';

            const hasBroken = /🔗|broken|error/i.test(output) && !/no broken|all good|0 broken/i.test(output);

            if (!hasBroken) {
              console.log('No broken links found.');
              return;
            }

            const body = '## Broken Links Report\n\n```\n' + output.slice(0, 5000) + '\n```\n\n_Generated on ' + new Date().toISOString().split('T')[0] + '_';

            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'type/broken-links'
            });

            if (issues.length > 0) {
              await github.rest.issues.update({
                ...context.repo, issue_number: issues[0].number, body
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title: 'Broken links report', body, labels: ['type/broken-links']
              });
            }
