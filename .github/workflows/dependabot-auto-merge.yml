name: Dependabot auto-merge

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: true

jobs:
  dependabot:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        # egress-policy: audit — block would pin api.github.com's rotating IPs
        # (gh CLI GraphQL at 140.82.112.6 intermittently refused connection).
        with:
          egress-policy: audit
          allowed-endpoints: |
            api.github.com:443
            github.com:443
      - name: Approve and enable auto-merge for Dependabot PRs
        shell: bash
        run: |
          set -euo pipefail
          prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --author "app/dependabot" --json number --jq '.[].number')"
          if [ -z "$prs" ]; then
            echo "No mergeable Dependabot PRs to process."
            exit 0
          fi
          for n in $prs; do
            echo "Processing dependabot PR #$n"
            body="$(gh pr view "$n" --repo "$GITHUB_REPOSITORY" --json title,body --jq '{title:.title,body:.body}')"
            is_major=""
            while IFS= read -r b; do
              [ -z "$b" ] && continue
              fm="$(printf '%s' "$b" | sed -E 's/^([0-9]+)\..*/\1/')"
              tm="$(printf '%s' "$b" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+ to ([0-9]+)\..*/\1/')"
              if [ -n "$fm" ] && [ -n "$tm" ] && [ "$tm" -gt "$fm" ]; then
                is_major=1
                break
              fi
            done <<< "$(printf '%s' "$body" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+ to [0-9]+\.[0-9]+\.[0-9]+')"
            if [ "$is_major" = "1" ]; then
              echo "PR #$n skipped: includes a major version bump (human review required)"
              continue
            fi
            gh pr review "$n" --approve --repo "$GITHUB_REPOSITORY" || true
            gh pr merge "$n" --auto --merge --repo "$GITHUB_REPOSITORY" || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
