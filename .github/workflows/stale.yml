name: Stale

on:
  schedule:
    - cron: '0 0 * * 0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899 # v10
        with:
          days-before-stale: 60
          days-before-close: 7
          exempt-issue-labels: 'type/todo,type/broken-links,type/dead-css,first-interaction'
          exempt-pr-labels: 'first-interaction'
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          stale-issue-message: |
            This issue has been inactive for 60 days. It will be closed in 7 days if no further activity occurs.
          stale-pr-message: |
            This PR has been inactive for 60 days. It will be closed in 7 days if no further activity occurs.
          close-issue-message: |
            This issue has been automatically closed due to inactivity.
          close-pr-message: |
            This PR has been automatically closed due to inactivity.
