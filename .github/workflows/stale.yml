name: Stale

on:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
        with:
          days-before-stale: 60
          days-before-close: 7
          exempt-issue-labels: 'type/todo,type/broken-links,first-interaction'
          exempt-pr-labels: 'first-interaction'
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          stale-issue-message: |
            This issue has been inactive for 60 days. It will be closed in 7 days if no further activity occurs.
          stale-pr-message: |
            This PR has been inactive for 60 days. It will be closed in 7 days if no further activity occurs.
          close-issue-message: |
            This issue has been automatically closed due to inactivity.
          close-pr-message: |
            This PR has been automatically closed due to inactivity.
