name: Stale

on:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue has been inactive for 60 days. Marking as stale.'
          stale-pr-message: 'This PR has been inactive for 60 days. Marking as stale.'
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: 'security,bug,enhancement'
