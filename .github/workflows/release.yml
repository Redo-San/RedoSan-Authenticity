name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # audit (not block): git-cliff's installer downloads from
          # api.github.com/objects.githubusercontent.com and fails instantly
          # under egress-policy block even with those endpoints allowed.
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Publish release and attach assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag =
              (context.payload.release && context.payload.release.tag_name) ||
              context.ref.replace('refs/tags/', '');

            // A tag can end up attached to more than one release when a
            // release's tag is changed in the UI. Prefer the published release
            // so a stale draft cannot be published over it.
            const findRelease = async () => {
              const releases = await github.paginate(
                github.rest.repos.listReleases, { owner, repo, per_page: 100 }
              );
              const matches = releases.filter((r) => r.tag_name === tag);
              return matches.find((r) => !r.draft) || matches[0] || null;
            };

            let release = await findRelease();
            if (!release) {
              try {
                release = (
                  await github.rest.repos.createRelease({
                    owner,
                    repo,
                    tag_name: tag,
                    name: tag,
                    generate_release_notes: true,
                  })
                ).data;
              } catch (e) {
                release = await findRelease();
                if (!release) throw e;
              }
            } else if (release.draft) {
              try {
                release = (
                  await github.rest.repos.updateRelease({
                    owner,
                    repo,
                    release_id: release.id,
                    draft: false,
                  })
                ).data;
              } catch (e) {
                // Only 422 already_exists on tag_name means another release
                // owns the tag (for example after a UI tag change). Any other
                // failure must stay visible instead of being swallowed.
                const data = e.response && e.response.data;
                const tagConflict =
                  e.status === 422 &&
                  data &&
                  data.code === 'already_exists' &&
                  data.field === 'tag_name';
                if (!tagConflict) throw e;
                const published = await findRelease();
                if (!published || published.draft) throw e;
                release = published;
                core.info(
                  `Skipped draft publish: ${published.tag_name} is already published`
                );
              }
            }

            if (fs.existsSync('CHANGELOG.md')) {
              const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                body: changelog,
              });
              core.info('Updated release body with CHANGELOG.md');
            }

            core.info(`Release ${release.name} (#${release.id}) is ready`);

            const assets = ['CHANGELOG.md', 'sbom.spdx.json'];
            for (const name of assets) {
              if (!fs.existsSync(name)) continue;
              const { data: releaseAssets } =
                await github.rest.repos.listReleaseAssets({
                  owner,
                  repo,
                  release_id: release.id,
                  per_page: 100,
                });
              const stale = releaseAssets.find((a) => a.name === name);
              if (stale) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: stale.id,
                });
                core.info(`Removed stale asset ${name}`);
                await new Promise(r => setTimeout(r, 2000));
              }
              let uploaded = false;
              for (let attempt = 0; attempt < 3 && !uploaded; attempt++) {
                try {
                  await github.rest.repos.uploadReleaseAsset({
                    owner,
                    repo,
                    release_id: release.id,
                    name,
                    data: fs.readFileSync(name),
                    headers: {
                      'content-type': name.endsWith('.json')
                        ? 'application/json'
                        : 'text/markdown',
                      'content-length': fs.statSync(name).size,
                    },
                  });
                  uploaded = true;
                  core.info(`Uploaded asset ${name}`);
                } catch (e) {
                  if (attempt < 2) {
                    core.info(`Upload attempt ${attempt + 1} failed, retrying...`);
                    await new Promise(r => setTimeout(r, 2000));
                  } else {
                    throw e;
                  }
                }
              }
            }
