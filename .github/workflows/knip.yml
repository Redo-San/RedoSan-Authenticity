name: Knip

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".tools/Developer_Toolkit/knip.json"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.html"

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  knip:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npx -y npm@12.2.2 ci
      - name: Knip report
        uses: codex-/knip-reporter@8186ad13f4f164dbb670eceed611e7a7423967dc # v4.1.0
        with:
          command_script_name: knip
          ignore_results: true
          annotations: false
          collapse_sections: auto
