name: npm audit Checker

on:
  pull_request:
    types: [opened, synchronize]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  pull-requests: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Run npm audit
        id: audit
        run: |
          npm audit --json 2>&1 || true
        continue-on-error: true
      - name: Report findings
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const run = require('child_process').execSync;
            const base = context.payload.pull_request.base.sha;

            const num = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: num });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('npm audit Checker'));

            // Only report when the dependency GRAPH changed. A metadata-only
            // edit (repository, homepage, files, keywords, contentPolicy, ...)
            // leaves `npm audit` output identical to the base branch, so
            // commenting on it would repeat advice that does not apply to the
            // change under review.
            const depKeys = ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies', 'overrides'];
            let graphChanged = run('git diff --name-only ' + base + '...HEAD -- package-lock.json', { encoding: 'utf8' }).trim().length > 0;
            if (!graphChanged) {
              const basePkg = JSON.parse(run('git show ' + base + ':package.json', { encoding: 'utf8' }));
              const headPkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              graphChanged = depKeys.some((k) => JSON.stringify(basePkg[k] || {}) !== JSON.stringify(headPkg[k] || {}));
            }
            if (!graphChanged) {
              if (existing) await github.rest.issues.deleteComment({ ...context.repo, comment_id: existing.id });
              console.log('Dependency graph unchanged - skipping audit report.');
              return;
            }

            let report;
            try {
              report = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
            } catch {
              const auditOut = run('npm audit --json 2>&1; exit 0', { encoding: 'utf8' });
              try { report = JSON.parse(auditOut); } catch { report = { metadata: { vulnerabilities: {} } }; }
            }

            const vulns = report?.metadata?.vulnerabilities || {};
            const total = Object.values(vulns).reduce((a, b) => a + b, 0);

            if (total === 0 && (!report?.vulnerabilities || Object.keys(report.vulnerabilities).length === 0)) {
              if (existing) await github.rest.issues.deleteComment({ ...context.repo, comment_id: existing.id });
              console.log('✅ No vulnerabilities found.');
              return;
            }

            // `npm audit fix` (without --force) only applies non-breaking
            // fixes, so say so honestly when it would be a no-op.
            const nonBreakingFixes = Object.values(report?.vulnerabilities || {})
              .filter((v) => v.fixAvailable === true).length;

            let prodTotal = null;
            try {
              const prodOut = run('npm audit --omit=dev --json 2>&1; exit 0', { encoding: 'utf8' });
              prodTotal = JSON.parse(prodOut)?.metadata?.vulnerabilities?.total ?? 0;
            } catch { /* report without the production line */ }

            const table = '| Severity | Count |\n|----------|------|\n' +
              ['critical', 'high', 'moderate', 'low'].map(s => `| ${s} | ${vulns[s] || 0}`).join('\n') +
              '\n\n**Total:** ' + total + ' vulnerabilities';

            let top = '';
            if (report?.vulnerabilities) {
              top = '\n\n**Top findings (up to 5):**\n\n' +
                Object.entries(report.vulnerabilities).slice(0, 5).map(([pkg, v]) =>
                  '- `' + pkg + '`: ' + (v.severity || 'unknown') + ' — ' + (v.via?.map?.(x => typeof x === 'string' ? x : x.source).filter(Boolean).join(', ') || '')
                ).join('\n');
            }

            const prod = prodTotal === null ? '' :
              `\n\n**Production (\`npm audit --omit=dev\`): ${prodTotal} vulnerabilities.**`;
            const advice = nonBreakingFixes > 0
              ? `\n\n_Run \`npm audit fix\` locally to address ${nonBreakingFixes} finding(s)._`
              : '\n\n`npm audit fix` would make **no changes** here: every remaining finding ' +
                'needs a semver-major bump (`npm audit fix --force`), which is a separate, ' +
                'deliberate upgrade rather than a drop-in fix.';

            const body = '## 🛡️ npm audit Checker\n\n' + table + top + prod + advice;

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: num, body });
            }
