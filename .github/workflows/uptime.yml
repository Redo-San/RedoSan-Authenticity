name: Uptime CI

on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [uptime]
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-upptime
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          allowed-endpoints: |
            api.github.com:443
            codeload.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            redo-san.github.io:443

      # main has a ruleset requiring PRs + status checks, so Upptime's direct
      # status commits must live on the unprotected `status` branch.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: status
          persist-credentials: true

      - name: Configure git authentication
        run: gh auth setup-git
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check endpoint status
        uses: upptime/uptime-monitor@9aa4499dce16aa3b144134cd767cb5a6aeb9660d # v1.46.2
        with:
          command: "update"
        env:
          GH_PAT: ${{ github.token }}
          SECRETS_CONTEXT: "{}"
