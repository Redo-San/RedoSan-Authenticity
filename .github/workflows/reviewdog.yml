name: Reviewdog

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reviewdog:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npx -y npm@11.20.0 ci
      - name: ESLint
        uses: reviewdog/action-eslint@3ee2a450da17e060b9dfa4bffd53976906c6b2b0 # v1.36.1
        with:
          reporter: github-pr-review
          filter_mode: diff_context
          fail_on_error: false
          eslint_flags: --config .tools/Developer_Toolkit/eslint.config.mjs --max-warnings 10000 .
      - name: actionlint
        uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440 # v1.81.1
        with:
          reporter: github-pr-review
          filter_mode: diff_context
          fail_on_error: false
      - name: misspell
        uses: reviewdog/action-misspell@840bfbe9f804da9afb0bd739dc4689012f3fdd2d # v1.30.4
        with:
          reporter: github-pr-review
          filter_mode: diff_context
          fail_on_error: false
          # vendor/ holds sha-pinned third-party bundles that are never
          # edited (AGENTS.md C6); vendor/human.js (~1.5 MB single line)
          # also exceeds GitHub's diff-comment size limit (API 422), which
          # failed this job on PR #575.
          exclude: |
            **/Style/lang/*.json
            **/Style/lang/i18n-data*.js
            **/vendor/**
