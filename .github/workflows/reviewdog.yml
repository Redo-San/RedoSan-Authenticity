name: Reviewdog

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reviewdog:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: ESLint
        uses: reviewdog/action-eslint@5eb89b1e6e94ca33e91c3814c34b25a8370bba46 # v1.35.0
        with:
          reporter: github-pr-review
          filter_mode: diff_context
          fail_on_error: false
          eslint_flags: --config .tools/Developer_Toolkit/eslint.config.mjs --max-warnings 10000 .
      - name: actionlint
        uses: reviewdog/action-actionlint@8b682e1e7e512151d73a6b9449cbff173846226e # v1.74.0
        with:
          reporter: github-pr-review
          filter_mode: diff_context
          fail_on_error: false
      - name: misspell
        uses: reviewdog/action-misspell@da40ce414be6ce320a9322aa2bae10bd3b9e6ef3 # v1.29.0
        with:
          reporter: github-pr-review
          filter_mode: diff_context
          fail_on_error: false
          exclude: |
            **/Style/lang/*.json
            **/Style/lang/i18n-data*.js
