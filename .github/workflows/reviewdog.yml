name: Reviewdog

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  reviewdog:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: ESLint
        uses: reviewdog/action-eslint@3ee2a450da17e060b9dfa4bffd53976906c6b2b0 # v1.36.1
        with:
          reporter: github-pr-review
          filter_mode: diff_context
          fail_on_error: false
          eslint_flags: --config .tools/Developer_Toolkit/eslint.config.mjs --max-warnings 10000 .
      - name: actionlint
        uses: reviewdog/action-actionlint@419a49378266e892f40c773b4f2fc6de9aa87499 # v1.80.4
        with:
          reporter: github-pr-review
          filter_mode: diff_context
          fail_on_error: false
      - name: misspell
        uses: reviewdog/action-misspell@ce198e1db0d029be165f2d3e809c1a42353446b0 # v1.30.2
        with:
          reporter: github-pr-review
          filter_mode: diff_context
          fail_on_error: false
          # vendor/ holds sha-pinned third-party bundles that are never
          # edited (AGENTS.md C6); vendor/human.js (~1.5 MB single line)
          # also exceeds GitHub's diff-comment size limit (API 422), which
          # failed this job on PR #575.
          exclude: |
            **/Style/lang/*.json
            **/Style/lang/i18n-data*.js
            **/vendor/**
