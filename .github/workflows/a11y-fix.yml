name: A11y Label Fixer

on:
  push:
    branches: ["main"]
    paths:
      - "*.html"
      - "*.js"
      - "**/*.html"
      - "**/*.js"
  workflow_dispatch:

permissions: {}

jobs:
  fix-orphan-labels:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run orphan label fixer
        run: node scripts/fix-orphan-labels.js
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "a11y: auto-fix orphan labels [skip ci]"
          branch: a11y/auto-fix
          delete-branch: true
          title: "a11y: auto-fix orphan labels"
          body: |
            Automated fix of orphan `<label>` elements detected by Lighthouse.

            Generated by the A11y Label Fixer workflow.
          labels: a11y,automated
