name: A11y Label Fixer

on:
  push:
    branches: ["main"]
    paths:
      - "*.html"
      - "*.js"
      - "**/*.html"
      - "**/*.js"
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fix-orphan-labels:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run orphan label fixer
        run: node scripts/fix-orphan-labels.js
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "a11y: auto-fix orphan labels [skip ci]"
          branch: a11y/auto-fix
          delete-branch: true
          title: "a11y: auto-fix orphan labels"
          body: |
            Automated fix of orphan `<label>` elements detected by Lighthouse.

            Generated by the A11y Label Fixer workflow.
          labels: a11y,automated
