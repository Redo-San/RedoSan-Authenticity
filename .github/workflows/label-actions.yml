name: Label actions

on:
  issues:
    types: [labeled, unlabeled]

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443
      - name: Run label actions
        uses: dessant/label-actions@d71129790bf2ef1ea975b5adbf68c21b5bea7b27 # v5.0.3
        with:
          config-path: .github/label-actions.yml
          process-only: "issues"
