name: Security Audit

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  audit:
    name: Scheduled npm audit (full scope)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install system deps (canvas)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libjpeg-turbo8-dev libpango1.0-dev libgif-dev librsvg2-dev build-essential
      - name: Install npm deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci
      - name: Run npm audit (full scope)
        # `npm audit` exits 1 when it finds vulnerabilities, which would kill
        # this step before the policy gate ever runs (the 2026-10-05 failure
        # mode). The JSON report is complete either way; the next step is the
        # actual gate. Fail here only when npm did not produce a valid report
        # (error payloads are JSON too but lack `metadata`/`vulnerabilities`).
        run: |
          set +e
          npm audit --json > audit-report.json
          set -e
          node -e "const r = JSON.parse(require('fs').readFileSync('audit-report.json', 'utf8')); if (!r.metadata || !r.vulnerabilities) { console.error('npm audit did not produce a valid report'); process.exit(1); }"
      - name: Enforce advisory exceptions policy
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
          if (!report.metadata || !report.vulnerabilities) {
            console.error('npm audit did not produce a valid report (audit error instead of findings)');
            process.exit(1);
          }
          const exceptions = fs
            .readFileSync('security/vulnerability-exceptions.md', 'utf8')
            .match(/\b(GHSA-[\w-]+|CVE-\d{4}-\d+)\b/g) || [];
          const allowed = new Set(exceptions);
          const unexcepted = [];
          // npm audit puts the advisory URL on `via` leaf objects, not on the
          // vulnerability entry itself; chain findings reference each other by
          // package name, so walk the links to collect the root advisory ids.
          const collectRootIds = (node, seen) => {
            if (typeof node === 'string') {
              if (seen.has(node)) return [];
              seen.add(node);
              const target = (report.vulnerabilities || {})[node];
              return target ? collectRootIds(target, seen) : [];
            }
            if (Array.isArray(node)) return node.flatMap((item) => collectRootIds(item, seen));
            if (node && typeof node === 'object') {
              const own =
                typeof node.url === 'string' && node.url.includes('advisories/')
                  ? [node.url.replace(/.*advisories\//, '')]
                  : [];
              return own.concat(collectRootIds(node.via || [], seen));
            }
            return [];
          };
          for (const id of Object.keys(report.vulnerabilities || {})) {
            const vuln = report.vulnerabilities[id];
            if (vuln.severity !== 'high' && vuln.severity !== 'critical') continue;
            const roots = [...new Set(collectRootIds(vuln, new Set()))];
            if (roots.length > 0 && roots.every((r) => allowed.has(r))) continue;
            unexcepted.push(`${roots.join(', ') || 'n/a'} (${id}) ${vuln.severity} ${vuln.range}`);
          }
          if (unexcepted.length) {
            console.error('High/critical advisories WITHOUT an exception entry (fix or document in security/vulnerability-exceptions.md):');
            for (const row of unexcepted) console.error('  - ' + row);
            process.exit(1);
          }
          console.log('No unexcepted high/critical advisories.');
          EOF
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-report
          path: audit-report.json
          if-no-files-found: error
