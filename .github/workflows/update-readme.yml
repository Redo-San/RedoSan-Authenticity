name: README Bot

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regenerate README sections
        id: readme
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: node scripts/update-readme.js
      - name: Create Pull Request
        if: steps.readme.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "docs(readme): sync generated README sections"
          branch: bot/readme/update
          delete-branch: true
          title: "docs(readme): sync generated README sections"
          body: |
            Automated README sync generated by the README Bot.

            Updated sections (marker-pair regenerated):
            - `testing-stats` — unit / E2E / test counts
            - `workflows` — CI/CD workflow count and category table
            - `whats-new` — release archive (on new releases)

            Review the diff and merge when the checks pass.
          labels: automated,documentation
