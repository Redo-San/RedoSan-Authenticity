name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: write
    steps:
      - name: Harden-Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Generate sitemap
        run: npm run sitemap

      # A FinalizeArtifact timeout makes upload-artifact retry and create a
      # second artifact with the same name, which fails deploy-pages with
      # "Multiple artifacts named github-pages" (actions/upload-pages-artifact#97).
      # Deleting stale artifacts before uploading guarantees exactly one
      # exists when we deploy, even after a failed run is re-run.
      - name: Remove stale github-pages artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: github-pages
          failOnError: false

      # Stage the complete site: root SPA (index.html, sw.js, 404.html) plus
      # the MPA pages under Style/pages and every feature directory they
      # reference via relative paths (../../../Face_Biometric, ...).
      # Removal_Tools is excluded on purpose: it is a work-in-progress service
      # that only runs locally, so its pages stay full-page redirects on prod.
      - name: Stage full site (SPA root + MPA pages)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html 404.html sw.js favicon.ico robots.txt sitemap.xml _site/
          cp -r Style _site/
          cp -r Watermark Audio_Watermark Pixel_Injection Document_Watermark \
                Fingerprint C2PA Certificate Face_Biometric \
                Decentralized_Identity_DID Timestamp Metadata Forensic \
                ID_Forge Converter Assistant vendor _site/
          du -sh _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: github-pages
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
