name: Code Review (OpenRouter)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string

concurrency:
  group: openrouter-review-${{ github.event.inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            openrouter.ai:443
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            agent.api.stepsecurity.io:443
            prod.app-api.stepsecurity.io:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Install jq (if missing)
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            curl -fsSL -o /tmp/jq https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
            curl -fsSL https://github.com/jqlang/jq/releases/download/jq-1.7.1/sha256sums.txt | grep -F "jq-linux-amd64" > /tmp/jq.sha256
            echo "  /tmp/jq" >> /tmp/jq.sha256
            (cd /tmp && sha256sum -c jq.sha256)
            sudo mv /tmp/jq /usr/local/bin/jq
            sudo chmod +x /usr/local/bin/jq
          fi
          jq --version
      - name: Run OpenRouter Code Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/ai-review-openrouter.sh
