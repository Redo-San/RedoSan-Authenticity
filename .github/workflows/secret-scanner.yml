name: Secret Scanner

on:
  pull_request:
    types: [opened, synchronize]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  pull-requests: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = require('child_process').execSync;
            const base = context.payload.pull_request.base.sha;

            const diff = run('git diff ' + base + '...HEAD', { encoding: 'utf8', maxBuffer: 10 * 1024 * 1024 });

            const patterns = [
              { re: /(?:^|[^a-zA-Z0-9])(sk-[a-zA-Z0-9]{20,})(?:$|[^a-zA-Z0-9])/gm, label: 'OpenAI/Groq API key (sk-...)' },
              { re: /(?:^|[^a-zA-Z0-9])(ghp_[a-zA-Z0-9]{36,})(?:$|[^a-zA-Z0-9])/gm, label: 'GitHub PAT (ghp_...)' },
              { re: /(?:^|[^a-zA-Z0-9])(gho_[a-zA-Z0-9]{36,})(?:$|[^a-zA-Z0-9])/gm, label: 'GitHub OAuth (gho_...)' },
              { re: /(?:^|[^a-zA-Z0-9])(ghu_[a-zA-Z0-9]{36,})(?:$|[^a-zA-Z0-9])/gm, label: 'GitHub App (ghu_...)' },
              { re: /(?:^|[^a-zA-Z0-9])(gsk_[a-zA-Z0-9]{20,})(?:$|[^a-zA-Z0-9])/gm, label: 'Groq API key (gsk_...)' },
              { re: /(?:^|[^a-zA-Z0-9])(ghr_[a-zA-Z0-9]{36,})(?:$|[^a-zA-Z0-9])/gm, label: 'GitHub Refresh Token (ghr_...)' },
              { re: /(?:^|[^a-zA-Z0-9])(AKIA[0-9A-Z]{16})(?:$|[^a-zA-Z0-9])/gm, label: 'AWS Access Key (AKIA...)' },
              { re: /-----BEGIN (RSA |EC )?PRIVATE KEY-----/gm, label: 'Private key block' },
              { re: /(?:^|[^a-zA-Z0-9])(xox[baprs]-[a-zA-Z0-9-]{20,})(?:$|[^a-zA-Z0-9])/gm, label: 'Slack token' },
              { re: /(?:^|[^a-zA-Z0-9])(ghb_[a-zA-Z0-9]{36,})(?:$|[^a-zA-Z0-9])/gm, label: 'GitHub Codespaces token (ghb_...)' },
              { re: /(?:^|[^a-zA-Z0-9])(github_pat_[a-zA-Z0-9]{36,})(?:$|[^a-zA-Z0-9])/gm, label: 'GitHub PAT (github_pat_...)' }
            ];

            const hits = [];
            const lines = diff.split('\n');

            for (let i = 0; i < lines.length; i++) {
              const line = lines[i];
              if (!line.startsWith('+')) continue;
              for (const p of patterns) {
                p.re.lastIndex = 0;
                const m = p.re.exec(line);
                if (m) {
                  const file = lines[i - 1]?.startsWith('+++ b/') ? lines[i - 1].slice(6) : 'unknown';
                  hits.push({ file, secret: m[1].slice(0, 12) + '...', type: p.label });
                  break;
                }
              }
            }

            const num = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: num });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes('Secret Scanner'));

            if (hits.length === 0) {
              if (existing) await github.rest.issues.deleteComment({ ...context.repo, comment_id: existing.id });
              console.log('✅ No secrets detected in this diff.');
              return;
            }

            let body = '## 🔒 Secret Scanner\n\n🚨 Potential secrets detected in this PR:\n\n' +
              '| File | Type | Secret prefix |\n|------|------|--------------|\n' +
              hits.map(h => `| \`${h.file}\` | ${h.type} | \`${h.secret}\` |`).join('\n') +
              '\n\n**Review and remove before merging.** If this is a false positive, add the file to `.gitignore` or use env variables.';

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: num, body });
            }
