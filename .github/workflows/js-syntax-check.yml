name: JS Syntax Check

on:
  pull_request:
    types: [opened, synchronize]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  pull-requests: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = require('child_process').execSync;
            const base = context.payload.pull_request.base.sha || 'origin/main';

            const diff = run('git diff --name-only --diff-filter=ACMRT ' + base + '...HEAD -- "*.js"', { encoding: 'utf8' });
            const files = diff.trim().split('\n').filter(Boolean);

            if (files.length === 0) {
              console.log('No JS files changed.');
              return;
            }

            const errors = [];
            for (const file of files) {
              try {
                run('node --check "' + file + '"', { encoding: 'utf8' });
              } catch (e) {
                errors.push('- `' + file + '`: ' + (e.stderr || e.message).trim().split('\n')[0]);
              }
            }

            const num = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: num
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('JS Syntax Check')
            );

            let body;
            if (errors.length === 0) {
              body = '## JS Syntax Check\n\n✅ All ' + files.length + ' changed JS file(s) passed syntax check.';
              if (existing) {
                await github.rest.issues.deleteComment({
                  ...context.repo, comment_id: existing.id
                });
              }
              return;
            }

            body = '## JS Syntax Check\n\nFound syntax error(s) in ' + errors.length + ' file(s):\n\n' + errors.join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: num, body
              });
            }
