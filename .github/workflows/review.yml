name: AI Code Review

on:
  workflow_dispatch:
    # Disabled: AI review free plan exhausted
    # pull_request:
    #   branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.groq.com:443
            api.github.com:443
            github.com:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Run AI Code Review (Groq)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          DIFF=$(gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} 2>/dev/null | head -3000)
          PR_DATA=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json title,body 2>/dev/null)
          TITLE=$(echo "$PR_DATA" | jq -r '.title')
          BODY=$(echo "$PR_DATA" | jq -r '.body' | head -500)

          PROMPT="Review this GitHub pull request.
          Title: $TITLE
          Description: $BODY

          Diff:
          \`\`\`diff
          $DIFF
          \`\`\`

          Focus on:
          1. Security vulnerabilities
          2. Logic bugs
          3. Code quality issues
          4. Missing edge cases

          Format as a concise bullet-point list with file:line references."

          JSON_PAYLOAD=$(jq -n --arg content "$PROMPT" '{"model":"llama-3.3-70b-versatile","messages":[{"role":"user","content":$content}],"temperature":0.1,"max_tokens":2000}')

          RESPONSE=$(curl -s --max-time 120 https://api.groq.com/openai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$JSON_PAYLOAD")

          REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "⚠️ AI review failed: \(.error.message // "unknown")"')
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "## 🤖 AI Code Review (Groq - Llama 3.3 70B)\n\n$REVIEW" 2>/dev/null || echo "Posted review comment"
