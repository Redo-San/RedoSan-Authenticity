name: AI Code Review

on:
  pull_request:
    branches: ["beta-release"]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6
      - name: Run AI Code Review (DeepSeek)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          DIFF=$(gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} 2>/dev/null | head -3000)
          PR_DATA=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --json title,body 2>/dev/null)
          TITLE=$(echo "$PR_DATA" | jq -r '.title')
          BODY=$(echo "$PR_DATA" | jq -r '.body' | head -500)

          PROMPT="Review this GitHub pull request.
          Title: $TITLE
          Description: $BODY

          Diff:
          \`\`\`diff
          $DIFF
          \`\`\`

          Focus on:
          1. Security vulnerabilities
          2. Logic bugs
          3. Code quality issues
          4. Missing edge cases

          Format as a concise bullet-point list with file:line references. Be critical but constructive."

          RESPONSE=$(curl -s https://api.deepseek.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d '{
              "model": "deepseek-chat",
              "messages": [{"role": "user", "content": '"$(echo "$PROMPT" | jq -Rs .)"'}],
              "temperature": 0.1,
              "max_tokens": 2000
            }')

          REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "Error: No response from AI"')
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "## 🤖 AI Code Review\n\n$REVIEW" 2>/dev/null || echo "Posted review comment"
