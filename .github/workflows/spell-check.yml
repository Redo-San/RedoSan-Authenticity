name: Spell Check

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v6
      - uses: codespell-project/actions-codespell@4848b4c0f038a77b5a64504a5e93b8fae962bc66 # v2
        with:
          check_filenames: true
          skip: .git,*.json,node_modules,./Style_Web_Page/lang/*.json
          ignore_words_list: ro,aks,te,reod,ist,ser,ba,noe
