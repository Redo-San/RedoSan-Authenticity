name: TypeDoc

on:
  pull_request:
    types: [opened, synchronize]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # puppeteer (via pa11y dependency) tries to download Chrome during
  # `npm ci`; storage.googleapis.com now returns 403 for pinned old builds,
  # breaking installs. TypeDoc does not need a browser, so skip the download.
  PUPPETEER_SKIP_DOWNLOAD: true
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true

permissions:
  contents: read

jobs:
  typedoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx typedoc --version
