name: TypeDoc

on:
  pull_request:
    types: [opened, synchronize]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  typedoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx typedoc --entryPointStrategy resolve --entryPoints "Style/mpa-router.js" --entryPoints "Style/navigation.js" --entryPoints "Style/shared.js" --entryPoints "Style/shared_validation.js" --skipErrorChecking --emit none
