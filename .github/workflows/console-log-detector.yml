name: Console.log Detector

on:
  pull_request:
    types: [opened, synchronize]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  pull-requests: write
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const run = require('child_process').execSync;
            const base = context.payload.pull_request.base.sha || 'origin/beta-release';

            const diff = run('git diff ' + base + '...HEAD -- "*.js" "*.html" "*.css"', { encoding: 'utf8' });

            const lines = [];
            const re = /^\+\s*(.*console\.log\s*\(.*)/gm;
            let match;
            while ((match = re.exec(diff)) !== null) {
              lines.push(match[1].trim());
            }

            const num = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: num
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Console.log Detector')
            );

            if (lines.length === 0) {
              if (existing) {
                await github.rest.issues.deleteComment({
                  ...context.repo, comment_id: existing.id
                });
              }
              return;
            }

            const body = '## Console.log Detector\n\nFound `console.log` statement(s) in this PR:\n\n```js\n' +
              lines.slice(0, 10).join('\n') +
              (lines.length > 10 ? '\n... and ' + (lines.length - 10) + ' more' : '') +
              '\n```\n\nPlease remove them before merging.';

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: num, body
              });
            }
