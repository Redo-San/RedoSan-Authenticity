name: Console.log Detector

on:
  pull_request:
    types: [opened, synchronize]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  pull-requests: write
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = require('child_process').execSync;
            const base = context.payload.pull_request.base.sha || 'origin/main';

            const diff = run('git diff ' + base + '...HEAD -- "*.js" "*.html" "*.css"', { encoding: 'utf8', maxBuffer: 10 * 1024 * 1024 });

            const blocks = [];
            const reFile = /^diff --git a\/(.*?) b\//gm;
            let m, last = null;
            while ((m = reFile.exec(diff)) !== null) {
              if (last) last.content = diff.slice(last.start, m.index);
              last = { file: m[1], start: m.index };
            }
            if (last) last.content = diff.slice(last.start);

            const excluded = ['vendor/', 'cli/', 'scripts/', 'Converter/ffmpeg.min.js'];
            const lines = [];
            const re = /^\+\s*(.*console\.log\s*\(.*)/gm;
            for (const block of blocks) {
              if (excluded.some(x => block.file.includes(x))) continue;
              let match;
              while ((match = re.exec(block.content)) !== null) {
                lines.push(match[1].trim());
              }
            }

            const num = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: num
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Console.log Detector')
            );

            if (lines.length === 0) {
              if (existing) {
                await github.rest.issues.deleteComment({
                  ...context.repo, comment_id: existing.id
                });
              }
              return;
            }

            const body = '## Console.log Detector\n\nFound `console.log` statement(s) in this PR:\n\n```js\n' +
              lines.slice(0, 10).join('\n') +
              (lines.length > 10 ? '\n... and ' + (lines.length - 10) + ' more' : '') +
              '\n```\n\nPlease remove them before merging.';

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: num, body
              });
            }
