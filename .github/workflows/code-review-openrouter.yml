name: Code Review (OpenRouter)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string

concurrency:
  group: openrouter-review-${{ github.event.inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number != '' ||
      (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: block
          allowed-endpoints: >
            openrouter.ai:443
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            agent.api.stepsecurity.io:443
            prod.app-api.stepsecurity.io:443
      - name: Run OpenRouter Code Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/code-review-openrouter.sh
