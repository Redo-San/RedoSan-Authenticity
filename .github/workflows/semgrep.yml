name: Semgrep SAST

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Run Semgrep
        continue-on-error: true
        uses: docker://semgrep/semgrep:1.72.0@sha256:cb4a443d44e794bd0e088adc998c8edb450e7418d88dec8ff86888f52f27bbe3
        with:
          args: semgrep --config=auto --error .
