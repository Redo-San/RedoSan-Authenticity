name: AI i18n Translation

on: 
  push:
    branches: ["beta-release"]
    paths: 
      - "Style_Web_Page/lang/en.json"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Translate missing keys
        run: node scripts/translate-i18n.js --apply
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: https://api.groq.com/openai
          MODEL: llama-3.3-70b-versatile
      - name: Commit translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Style_Web_Page/lang/
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "auto: translate new i18n keys" && git push; fi
