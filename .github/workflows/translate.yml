name: AI i18n Translation

on: 
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: 
      - "Style_Web_Page/lang/en.json"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.groq.com:443
            github.com:443
            api.github.com:443
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Translate missing keys
        run: node scripts/translate-i18n.js --apply
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: https://api.groq.com/openai
          MODEL: llama-3.3-70b-versatile
      - name: Commit translations
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.TRANSLATE_PAT }}@github.com/${{ github.repository }}
          git add Style_Web_Page/lang/
          if git diff --cached --quiet; then echo "No changes" >> $GITHUB_OUTPUT; exit 0; fi
          git commit -m "auto: translate new i18n keys"
          echo "has_changes=true" >> $GITHUB_OUTPUT
      - name: Create PR
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.TRANSLATE_PAT }}
        run: |
          BRANCH="auto/translate-i18n-$(date +%s)"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "auto: translate new i18n keys" \
            --body "AI-generated translation of new i18n keys detected in \`en.json\`." \
            --label "automated"
