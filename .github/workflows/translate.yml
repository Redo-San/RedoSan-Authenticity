name: AI i18n Translation

on:
  push:
    branches: ["main"]
    paths:
      - "Style/lang/en.json"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  translate:
    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.mymemory.translated.net:443
            api.translate.zvo.cn:443
            github.com:443
            libretranslate.com:443
            models.inference.ai.azure.com:443
            registry.npmjs.org:443
            translate.googleapis.com:443
            translate.mstdn.social:443
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Translate missing keys
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/translate-i18n.js --apply
      - name: Sync JSON → JS files
        run: node scripts/sync-i18n-json-to-js.js
      - name: Format generated JS files
        run: npx --yes prettier --write Style/lang/i18n-data-*.js
      - name: Commit translations
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Style/lang/
          if git diff --cached --quiet; then echo "has_changes=false" >> $GITHUB_OUTPUT; exit 0; fi
          git commit -m "auto: translate new i18n keys"
          echo "has_changes=true" >> $GITHUB_OUTPUT
      - name: Create PR
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="auto/translate-i18n-$(date +%s)"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(i18n): translate new i18n keys" \
            --body "Translation of new i18n keys detected in \`en.json\`." \
            --label "automated"
