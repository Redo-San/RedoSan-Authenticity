name: 'AI Code Review'
description: 'Review PRs using DeepSeek AI model'
inputs:
  openai-api-key:
    description: 'DeepSeek API key (OpenAI-compatible)'
    required: true
  github-token:
    description: 'GitHub token'
    required: true
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    - name: Fetch PR diff and review
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        PR_URL="${{ github.event.pull_request.html_url }}"
        REPO="${{ github.repository }}"
        PR_NUM="${{ github.event.pull_request.number }}"

        # Get PR diff
        DIFF=$(gh pr diff $PR_NUM --repo $REPO 2>/dev/null | head -2000)

        # Get PR title + description
        PR_DATA=$(gh pr view $PR_NUM --repo $REPO --json title,body 2>/dev/null)
        TITLE=$(echo "$PR_DATA" | jq -r '.title')
        BODY=$(echo "$PR_DATA" | jq -r '.body' | head -500)

        # Build prompt
        PROMPT="Review this GitHub pull request.
        Title: $TITLE
        Description: $BODY

        Diff:
        \`\`\`diff
        $DIFF
        \`\`\`

        Focus on:
        1. Security vulnerabilities
        2. Logic bugs
        3. Code quality issues
        4. Missing edge cases

        Format as a concise bullet-point list with file:line references. Be critical but constructive."

        # Call DeepSeek API
        RESPONSE=$(curl -s https://api.deepseek.com/v1/chat/completions \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer ${{ inputs.openai-api-key }}" \
          -d '{
            "model": "deepseek-chat",
            "messages": [{"role": "user", "content": '"$(echo "$PROMPT" | jq -Rs .)"'}],
            "temperature": 0.1,
            "max_tokens": 2000
          }')

        REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "Error: No response from AI"')

        # Post review as PR comment
        gh pr comment $PR_NUM --repo $REPO --body "## 🤖 AI Code Review (DeepSeek)\n\n$REVIEW" 2>/dev/null || true
