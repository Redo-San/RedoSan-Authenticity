[package]
name = "redosan-authenticity"
version = "2.0.1"
description = "Client-side digital authenticity toolkit (watermark, fingerprint, C2PA, forensics)"
edition = "2021"
authors = ["Redo-San"]
license = "GPL-2.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
