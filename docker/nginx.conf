# RedoSan Authenticity — nginx configuration for the site container image.
#
# The site was authored for GitHub Pages under /RedoSan-Authenticity/ and
# contains ~840 absolute /RedoSan-Authenticity/... references (index.html,
# 404.html, the sw.js precache list, every MPA page). The rewrites below map
# those URLs onto the same document root, so the container works both at /
# and under the historical GitHub Pages base path.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # GitHub Pages base-path compatibility (must run before location match).
    rewrite ^/RedoSan-Authenticity$ / permanent;
    rewrite ^/RedoSan-Authenticity/(.*)$ /$1 last;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    error_page 404 /404.html;

    # The service worker must always be revalidated or updates never land.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # ONNX runtime WebAssembly needs the correct MIME for streaming compile.
    location ~* \.wasm$ {
        default_type application/wasm;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(?:css|mjs|js|json|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|bin)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
