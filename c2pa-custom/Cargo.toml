[package]
name = "c2pa-custom"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
console_error_panic_hook = { version = "0.1.7", optional = true }
js-sys = "0.3.77"
wasm-bindgen-futures = "0.4.50"
c2pa = { version = "=0.82.0", features = ["pdf", "rust_native_crypto", "fetch_remote_manifests", "json_schema", "http_reqwest"], default-features = false }
async-trait = "0.1.88"
thiserror = "2.0.12"
serde-wasm-bindgen = "0.6.5"
serde = "1.0.219"
serde_bytes = "0.11.19"

[dependencies.web-sys]
version = "0.3.77"
features = [
    'console',
    'Blob',
    'FileReaderSync',
]

[dependencies.wasm-bindgen]
version = "0.2.120"
