<script>
var DANGEROUS_EXTS = ['.exe','.msi','.bat','.cmd','.com','.scr','.pif','.ps1','.psm1','.psd1','.vbs','.vbe','.jse','.wsf','.wsh','.dll','.ocx','.sys','.drv','.jar','.sh','.pl','.py','.rb','.bash','.app','.msu','.msp','.reg','.inf','.gadget','.cpl','.mst','.hta','.ws','.vb','.vba','.swf','.action','.elf','.so','.ko','.deb','.rpm','.run','.lua','.tcl','.awk','.apk','.flatpak','.snap','.appimage'];

var JS_WHITELIST = [
  '/RedoSan-Authenticity/sw.js',
  '/RedoSan-Authenticity/Style_Web_Page/shared.js',
  '/RedoSan-Authenticity/Style_Web_Page/simplified.js',
  '/RedoSan-Authenticity/Style_Web_Page/navigation.js',
  '/RedoSan-Authenticity/Style_Web_Page/i18n.js',
  '/RedoSan-Authenticity/Style_Web_Page/search.js',
  '/RedoSan-Authenticity/Style_Web_Page/certificate.js',
  '/RedoSan-Authenticity/Watermark/watermark.js',
  '/RedoSan-Authenticity/Watermark/watermark_core.js',

  '/RedoSan-Authenticity/Pixel_Injection/pixel_injection.js',

  '/RedoSan-Authenticity/Pixel_Injection/advanced_watermarking.js',
  '/RedoSan-Authenticity/Timestamp/timestamp.js',
  '/RedoSan-Authenticity/Fingerprint/hashing.js',
  '/RedoSan-Authenticity/Fingerprint/fingerprint_ui.js',
  '/RedoSan-Authenticity/C2PA/cbor.js',
  '/RedoSan-Authenticity/C2PA/c2pa.js',
  '/RedoSan-Authenticity/Metadata/metadata.js'
];

function isThreatPath(p) {
  var lower = p.toLowerCase();
  // Check dangerous extensions
  for (var i = 0; i < DANGEROUS_EXTS.length; i++) {
    if (lower.endsWith(DANGEROUS_EXTS[i])) return true;
  }
  // Block unknown .js files not in whitelist
  if (lower.endsWith('.js') && JS_WHITELIST.indexOf(p) === -1) return true;
  // Block embedded URLs in path (e.g., /Base/https://evil.com/script  or  /Base//evil.com/script)
  // Catches single, double, and triple URL-encoded variants
  var decoded = decodeURIComponent(p);
  var decodedLower = decoded.toLowerCase();
  // Second decode for triple-encoding (e.g., %25252F → %2F)
  var decoded2;
  try { decoded2 = decodeURIComponent(decodedLower); } catch(e) { decoded2 = ''; }
  if (decodedLower.includes('://') || decoded2.includes('://')) return true;
  if (decodedLower.includes('%3a%2f%2f') || decoded2.includes('%3a%2f%2f')) return true;
  if (decodedLower.includes('%2f%2f') || decoded2.includes('%2f%2f')) return true;
  if (/\/\/([a-z0-9]([a-z0-9-]*\.)+[a-z]{2,})/.test(decodedLower) && !decodedLower.startsWith('//')) return true;
  if (/\/\/([a-z0-9]([a-z0-9-]*\.)+[a-z]{2,})/.test(decoded2) && !decoded2.startsWith('//')) return true;
  return false;
}

function showThreatPage(path) {
  document.title = '⚠️ Threat Blocked — RedoSan Authenticity';
  document.getElementById('main-content').innerHTML =
    '<div class="threat-container">' +
    '<div class="threat-icon">&#x26A0;&#xFE0F;</div>' +
    '<h1 class="threat-title">Security Threat Blocked</h1>' +
    '<p class="threat-desc">This URL appears to be a malicious file disguised as a legitimate resource.</p>' +
    '<div class="threat-path">' + path.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' +
    '<p class="threat-desc">&#x1F512; RedoSan Authenticity is a client-side digital authenticity tool and does <strong>not</strong> serve executable files or scripts. If you received this link from someone, it is likely a scam or phishing attempt.</p>' +
    '<a href="/RedoSan-Authenticity/" class="threat-btn">Return to Safety</a>' +
    '<div class="threat-exts">Blocked: .exe .msi .bat .cmd .ps1 .vbs .dll .jar .sh .py .elf .so .deb .rpm .lua .apk and more</div>' +
    '<div class="threat-note">If you believe this is a mistake, please report it on <a href="https://github.com/Redo-San/RedoSan-Authenticity/issues" style="color:#6C5CE7" target="_blank" rel="noopener">GitHub Issues</a>.</div>' +
    '</div>';
}

function show404Page() {
  var fb = document.getElementById('staticFallback');
  if (fb) fb.style.display = 'none';
  document.getElementById('main-content').innerHTML =
    '<div class="error-page">' +
    '<div class="error-code">404</div>' +
    '<h1 class="error-title">Page Not Found</h1>' +
    '<p class="error-desc">The page you\'re looking for doesn\'t exist or has been moved. Try searching below or use the navigation.</p>' +
    '<div class="error-search">' +
    '<input type="text" id="errorSearchInput" placeholder="Search the site..." aria-label="Search">' +
    '</div>' +
    '<div class="error-links">' +
    '<a href="/RedoSan-Authenticity/">Home</a>' +
    '<a href="/RedoSan-Authenticity/#watermark">Watermark</a>' +
    '<a href="/RedoSan-Authenticity/#fingerprint">Fingerprint</a>' +
    '<a href="/RedoSan-Authenticity/#metadata">Metadata</a>' +
    '<a href="/RedoSan-Authenticity/#timestamp">Timestamp</a>' +
    '<a href="https://github.com/Redo-San/RedoSan-Authenticity/issues" target="_blank" rel="noopener">Report Issue</a>' +
    '</div>' +
    '</div>';

  var input = document.getElementById('errorSearchInput');
  if (input) {
    input.addEventListener('keydown', function(e) { if (e.key === 'Enter') doErrorSearch(); });
    input.addEventListener('focus', function() {
      this.parentElement.style.boxShadow = '0 0 0 3px rgba(108,92,231,.15)';
      this.parentElement.style.borderColor = '#6C5CE7';
    });
    input.addEventListener('blur', function() {
      this.parentElement.style.boxShadow = '';
      this.parentElement.style.borderColor = '';
    });
  }
}

function doErrorSearch() {
  var q = document.getElementById('errorSearchInput');
  if (!q || !q.value.trim()) return;
  window.location.href = '/RedoSan-Authenticity/?search=' + encodeURIComponent(q.value.trim());
}

var requestedPath = window.location.pathname;
if (isThreatPath(requestedPath)) {
  showThreatPage(requestedPath);
} else {
  show404Page();
}
</script>
